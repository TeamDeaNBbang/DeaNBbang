<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="WritingPage" content="width=device-width, initial-scale=1.0" />
    <title>글 작성 페이지</title>
     <link rel="stylesheet" href="../css/writingPage.css">
  </head>
  <body>
    <header>
      <a href="MainPage.html" class="Logo">대N</a>
      <a href="creat.html" class="Write">글쓰기</a>
      <a href="Login.html" class="Login">로그인</a>
    </header>
    <main>
      <h1>모집 글 작성</h1>
      <form action="register.php">
        <fieldset>
          <ul id="inputlist" style="list-style: none; padding: 0">
            <li>
              <label class="explane" for="content">상품 이미지<label class="Asterisk"> *</label></label>
              <label class="imageBox" for="content">이미지를 업로드해 주세요 (JPG,PNG 권장)</label>
              <input type="file"/>
            </li>
            <li>
              <div class="input-group">
                <label for="productName">상품명 *</label>
                <input type="text" id="productName" name="productName" placeholder="상품명을 입력하세요" required/>
              </div>

              <label class="explane" for="content">설명<label class="Asterisk"> *</label></label>
              <textarea name="content" id="content" required></textarea>
            </li>
            <li>
              <label class="explane" for="number"
                >1인 예상 금액<label class="Asterisk"> *</label></label
              >
              <input type="number" id="name" required />
            </li>
            <li>
              <label class="explane" for="number"
                >모집 인원<label class="Asterisk"> *</label></label
              >
              <label class="explaneEX" id="">(작성자 포함)</label>
              <input type="number" id="number" required />
            </li>
            <li>
              <label class="explane" for="date"
                >마감일<label class="Asterisk"> *</label></label
              >
              <input type="date" id="date" required />
            </li>
          </ul>
        </fieldset>
        <div id="button">
          <button type="reset" class="reset-bttn">취소</button>
          <button type="submit" class="submit-bttn">등록하기</button>
        </div>
      </form>
    </main>
  </body>
</html>
