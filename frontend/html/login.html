<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>로그인 | 대N</title>
    <script src="/js/auth.js" defer></script>
</head>
<body>
    <main>
        <h1>로그인</h1>
        <form id="login-form" action="/api/auth/login" method="post">
            <p><label>이메일 <input name="email" type="email" autocomplete="username" required></label></p>
            <p><label>비밀번호 <input name="password" type="password" autocomplete="current-password" maxlength="256" required></label></p>
            <button type="submit">로그인</button>
            <p id="login-status" role="status"></p>
        </form>
        <a href="/html/signup.html">회원가입</a>
        <a href="/">메인 화면</a>
    </main>
</body>
</html>
